[project]
name = "image-search"
version = "0.1.0"
description = "Local semantic search over screenshots & photos"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Phase 1: text path. OCR runs out-of-process in a separate conda env
# (`sem_search_ocr`, see docs/gpu-setup.md) — its deps are NOT installed here.
text = [
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
]
# Phase 2+: image embedding, captioning, tagging, faces, layout (not built yet)
full = [
    "image-search[text]",
]

[project.scripts]
image-search = "image_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
