# Windows-native twin of pictures.yaml: same folder NAME and same DB file
# (spelled the Windows way), so ingest can run natively on Windows (faster
# disk + more RAM) and WSL can search the result, or vice versa.
db: C:\Users\rluna\.image-search\pictures.db

defaults:
  text_embed: bge-small-en-v1.5

folders:
  pictures:
    path: C:\Users\rluna\Pictures
    image_embed: wkcn/TinyCLIP-ViT-8M-16-Text-3M-YFCC15M
    tagger: wkcn/TinyCLIP-ViT-8M-16-Text-3M-YFCC15M
    ocr: rapidocr
    caption: blip-base
    route: auto

private: []
