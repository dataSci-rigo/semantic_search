<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>photo search</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, sans-serif;
         min-height: 100vh; padding: 1rem; }
  h1 { color: #38bdf8; font-size: 1.25rem; margin-bottom: 1rem; letter-spacing: .05em; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] { flex: 1; background: #1e293b; border: 1px solid #334155;
         border-radius: 8px; padding: .7rem .9rem; color: #e2e8f0; font-size: 1rem; }
  select { background: #1e293b; border: 1px solid #334155; border-radius: 8px;
         padding: .7rem .6rem; color: #e2e8f0; font-size: .9rem; max-width: 12rem; }
  button { border: none; border-radius: 8px; padding: .7rem 1.1rem; font-size: .9rem;
           font-weight: 600; cursor: pointer; background: #1e3a5f; color: #7dd3fc; }
  .error { background: #7f1d1d; color: #f87171; border-radius: 8px; padding: .75rem;
           margin-bottom: 1rem; font-size: .85rem; }
  .empty { color: #64748b; font-size: .9rem; padding: 1rem 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: .75rem; }
  .card { background: #1e293b; border-radius: 10px; overflow: hidden;
          border: 1px solid #334155; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card-info { padding: .5rem .6rem; font-size: .72rem; color: #94a3b8; }
  .card-info .score { color: #7dd3fc; font-weight: 600; }
  .card-links { display: flex; gap: .5rem; padding: 0 .6rem .5rem; }
  .card-links a { font-size: .7rem; color: #a78bfa; text-decoration: none; }
</style>
</head>
<body>

<h1>photo search</h1>

<form method="get" action="/">
  <input type="text" name="q" value="{{ query }}" placeholder="search your photos…" autofocus>
  {% if folders|length > 1 %}
  <select name="folder">
    {% for f in folders %}
    <option value="{{ f }}" {% if f == folder %}selected{% endif %}>{{ f.rsplit('/', 1)[-1] or f }}</option>
    {% endfor %}
  </select>
  {% endif %}
  <button type="submit">Search</button>
</form>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

{% if query and not hits and not error %}
<div class="empty">No results for "{{ query }}".</div>
{% endif %}

<div class="grid">
  {% for hit in hits %}
  <div class="card">
    <a href="/full/{{ hit.image_id }}"><img src="/image/{{ hit.image_id }}" loading="lazy"></a>
    <div class="card-info">
      <span class="score">{{ "%.3f"|format(hit.score) }}</span> · {{ hit.source }}
    </div>
    <div class="card-links">
      <a href="/similar/{{ hit.image_id }}?folder={{ folder|urlencode }}">similar</a>
      <a href="/full/{{ hit.image_id }}">full size</a>
    </div>
  </div>
  {% endfor %}
</div>

</body>
</html>
